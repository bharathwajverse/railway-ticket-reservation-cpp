name: C++ Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build railway_cli
        run: |
          mkdir -p backend/database/data
          g++ -std=c++17 -Wall -Wextra \
            -Ibackend/include -Ibackend/dsa -Ibackend/database -Ibackend/src \
            backend/src/main.cpp backend/src/menu.cpp \
            backend/dsa/*.cpp backend/database/*.cpp \
            -o backend/railway_cli

      - name: Build railway_api
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -Ibackend/include -Ibackend/dsa -Ibackend/database -Ibackend/api \
            backend/api/server.cpp backend/api/routes.cpp \
            backend/dsa/*.cpp backend/database/*.cpp \
            -lpthread \
            -o backend/railway_api

      - name: Test Execution
        run: echo "0" | ./backend/railway_cli

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup MSYS2 & GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build railway_cli
        run: |
          mkdir -p backend/database/data
          g++ -std=c++17 -Wall -Wextra \
            -Ibackend/include -Ibackend/dsa -Ibackend/database -Ibackend/src \
            backend/src/main.cpp backend/src/menu.cpp \
            backend/dsa/*.cpp backend/database/*.cpp \
            -o backend/railway_cli.exe

      - name: Build railway_api
        run: |
          g++ -std=c++17 -Wall -Wextra \
            -Ibackend/include -Ibackend/dsa -Ibackend/database -Ibackend/api \
            backend/api/server.cpp backend/api/routes.cpp \
            backend/dsa/*.cpp backend/database/*.cpp \
            -lws2_32 \
            -o backend/railway_api.exe

      - name: Test Run
        run: echo "0" | ./backend/railway_cli.exe

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build railway_cli
        run: |
          mkdir -p backend/database/data
          clang++ -std=c++17 -Wall -Wextra \
            -Ibackend/include -Ibackend/dsa -Ibackend/database -Ibackend/src \
            backend/src/main.cpp backend/src/menu.cpp \
            backend/dsa/*.cpp backend/database/*.cpp \
            -o backend/railway_cli

      - name: Build railway_api
        run: |
          clang++ -std=c++17 -Wall -Wextra \
            -Ibackend/include -Ibackend/dsa -Ibackend/database -Ibackend/api \
            backend/api/server.cpp backend/api/routes.cpp \
            backend/dsa/*.cpp backend/database/*.cpp \
            -lpthread \
            -o backend/railway_api

      - name: Test Run
        run: echo "0" | ./backend/railway_cli
