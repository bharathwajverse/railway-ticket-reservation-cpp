name: C++ Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Application
        run: g++ -std=c++11 -Wall -Wextra main.cpp dsa_manager.cpp database.cpp -o railway

      - name: Test Execution
        run: echo "0" | ./railway

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Compile Application
        run: g++ -std=c++11 -Wall -Wextra main.cpp dsa_manager.cpp database.cpp -o railway.exe

      - name: Test Run
        run: echo 0 | .\railway.exe
